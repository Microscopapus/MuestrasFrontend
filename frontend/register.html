<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="pantalla-auth">
  <div class="card-auth">

    <div class="auth-logo">🔬</div>
    <h1>MUESTRAS</h1>
    <p class="auth-subtitulo">Crea tu cuenta</p>

    <!-- MENSAJE DE ERROR -->
    <div class="auth-error" id="auth-error" style="display:none">
      <span id="auth-error-msg"></span>
    </div>

    <!-- FORMULARIO -->
    <div class="auth-form">
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" placeholder="Tu nombre" autocomplete="name">
      </div>
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email">
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
      </div>
      <div class="campo">
        <label for="password2">Confirmar contraseña</label>
        <input type="password" id="password2" placeholder="Repite tu contraseña" autocomplete="new-password">
      </div>
      <button class="btn-principal" onclick="registrar()">Crear cuenta</button>
    </div>

    <div class="separador"><span>o</span></div>

    <!-- GOOGLE -->
    <button class="btn-google" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Registrarse con Google
    </button>

  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
