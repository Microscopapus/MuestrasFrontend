<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="pantalla-auth split">

  <!-- 🧾 FORM (TU CARD) -->
  <div class="lado lado-form">
    <div class="card-auth">

      <!-- LOGO -->
      <div class="logo-box">
        <img src="imglogo.png" alt="logo" class="logo-img">
      </div>

      <h1>MUESTRAS</h1>
      <p class="auth-subtitulo">Crea tu cuenta</p>

      <!-- ERROR -->
      <div class="auth-error" id="auth-error" style="display:none">
        <span id="auth-error-msg"></span>
      </div>

      <!-- FORM -->
      <div class="auth-form">
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" placeholder="Tu nombre" autocomplete="name">
        </div>

        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email">
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
        </div>

        <div class="campo">
          <label for="password2">Confirmar contraseña</label>
          <input type="password" id="password2" placeholder="Repite tu contraseña" autocomplete="new-password">
        </div>

        <button class="btn-principal" onclick="registrar()">Crear cuenta</button>
      </div>

      <div class="separador"><span>o</span></div>

      <!-- GOOGLE -->
      <div id="btn-google-container"></div>

      <p class="auth-link">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </p>

    </div>
  </div>

  <!-- 🖼 IMAGEN (DERECHA) -->
  <div class="lado lado-img">
    <div class="img-box">
      <img src="imgreg.png" alt="register">
    </div>
  </div>

</div>

<script src="https://accounts.google.com/gsi/client"></script>
<script src="auth.js"></script>
</body>
</html>
