<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta — Zoom Explorer</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-wrap">

  <!-- ── IMAGEN (izquierda en desktop, oculta en móvil) ── -->
  <div class="auth-img">
    <img src="../Assets/imgreg.png" alt="Laboratorio">
    <div class="auth-img-overlay">

  <!-- ── FORM (derecha en desktop, único en móvil) ── -->
  <div class="auth-panel">
    <div class="auth-card">

      <div class="auth-logo">
        <img src="../Assets/imglogo.png" alt="Zoom Explorer">
      </div>

      <div class="auth-heading">
        <h1 class="auth-title">Crea tu <em>cuenta</em></h1>
        <p class="auth-sub">Únete a la comunidad científica de Zoom Explorer</p>
      </div>

      <div class="auth-error" id="auth-error">
        <span id="auth-error-msg"></span>
      </div>

      <div class="auth-form">

        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" placeholder="Tu nombre" autocomplete="name">
        </div>

        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email">
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <div class="campo-input-wrap">
            <input type="password" id="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
            <button class="toggle-pass" type="button" onclick="togglePassword('password', this)" aria-label="Mostrar contraseña">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="campo">
          <label for="password2">Confirmar contraseña</label>
          <div class="campo-input-wrap">
            <input type="password" id="password2" placeholder="Repite tu contraseña" autocomplete="new-password">
            <button class="toggle-pass" type="button" onclick="togglePassword('password2', this)" aria-label="Mostrar contraseña">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button class="btn-auth" onclick="registrar()">Crear Cuenta</button>

      </div>

      <div class="separador"><span>o continúa con</span></div>

      <div id="btn-google-container"></div>

      <p class="auth-link">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>

    </div>
  </div>

</div>

<script src="https://accounts.google.com/gsi/client"></script>
<script src="auth.js"></script>
</body>
</html>
