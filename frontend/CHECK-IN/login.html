<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Zoom Explorer</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-wrap">

  <!-- ── FORM (izquierda en desktop, único en móvil) ── -->
  <div class="auth-panel">
    <div class="auth-card">

      <div class="auth-logo">
        <img src="../Assets/imglogo.png" alt="Zoom Explorer">
      </div>

      <div class="auth-heading">
        <h1 class="auth-title">Bienvenido <em>de vuelta</em></h1>
        <p class="auth-sub">Accede a tu cuenta para continuar explorando</p>
      </div>

      <div class="auth-error" id="auth-error">
        <span id="auth-error-msg"></span>
      </div>

      <div class="auth-form">

        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email">
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <div class="campo-input-wrap">
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            <button class="toggle-pass" type="button" onclick="togglePassword('password', this)" aria-label="Mostrar contraseña">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button class="btn-auth" onclick="loginEmail()">Iniciar Sesión</button>

      </div>

      <div class="separador"><span>o continúa con</span></div>

      <div id="btn-google-container"></div>

      <p class="auth-link">¿No tienes cuenta? <a href="register.html">Crear cuenta</a></p>

    </div>
  </div>

  <!-- ── IMAGEN (derecha en desktop, oculta en móvil) ── -->
  <div class="auth-img">
    <img src="../Assets/imglog.png" alt="Microscopio">
    <div class="auth-img-overlay">

</div>

<script src="https://accounts.google.com/gsi/client"></script>
<script src="auth.js"></script>
</body>
</html>
