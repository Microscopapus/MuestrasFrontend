<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoom Explorer — Muestras</title>
  <link rel="stylesheet" href="panpri.css">
</head>
<body>

<!-- ══ NAVBAR ══ -->
<header class="navbar">
  <div class="navbar-logo">
    <img src="../Assets/imglog.png" alt="Zoom Explorer">
    <span>Zoom Explorer</span>
  </div>
  <div class="navbar-actions">
    <span class="nav-usuario" id="nav-usuario-nombre"></span>
    <button class="nav-btn" onclick="abrirFavoritos()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <span>Favoritos</span>
    </button>
    <button class="nav-btn accent" onclick="abrirModalCrear()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>Nueva muestra</span>
    </button>
    <button class="nav-btn danger" onclick="cerrarSesion()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Salir</span>
    </button>
  </div>
</header>

<!-- ══ ÁREA PRINCIPAL ══ -->
<div class="app-area">

  <!-- Pantalla cargando -->
  <div class="pantalla activo" id="pantalla-cargando">
    <div class="spinner"></div>
    <p>Cargando catálogo…</p>
  </div>

  <!-- Pantalla error -->
  <div class="pantalla" id="pantalla-error">
    <span style="font-size:48px;opacity:0.4;">⚠️</span>
    <h2>No se pudo cargar el catálogo</h2>
    <p id="error-msg"></p>
    <button class="btn-reintentar" onclick="cargarMuestras()">↺ Reintentar</button>
  </div>

  <!-- Layout principal -->
  <div class="main-layout" id="pantalla-contenido">

    <!-- PANEL IZQUIERDO: catálogo -->
    <aside class="catalogo-panel">

      <div class="panel-head">
        <div class="panel-label">Catálogo</div>

        <div class="search-box" style="margin-bottom:10px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="buscar-muestra" placeholder="Buscar muestra…" oninput="filtrarPorNombre(this.value)" autocomplete="off">
        </div>

        <div id="cat-chips" class="chips-row"></div>

        <div class="autocomplete-wrap">
          <div class="search-box" style="margin-bottom:0;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="cat-filtro" placeholder="Filtrar por categoría…" oninput="onCatFiltroInput(this.value)" autocomplete="off">
          </div>
          <div class="autocomplete-list" id="cat-filtro-lista"></div>
        </div>
      </div>

      <div class="catalogo-count">
        <span id="count-num">0</span> muestras
      </div>

      <div class="catalogo-grid" id="menu-grid"></div>
    </aside>

    <!-- PANEL DERECHO: detalle -->
    <main class="detalle-panel">
      <div class="detalle-vacio" id="detalle-vacio">
        <div class="vacio-icon">🔬</div>
        <p>Selecciona una muestra<br>del catálogo para verla aquí</p>
      </div>
      <div id="detalle-muestra">
        <div id="detalle-imagen"></div>
        <h2 id="detalle-nombre"></h2>
        <span class="badge-cat" id="detalle-cat" style="display:none;"></span>
        <p id="detalle-desc"></p>
        <div class="detalle-acciones">
          <button class="btn-accion btn-editar" onclick="abrirModalEditar()" style="display:none;">✏️ Editar</button>
          <button class="btn-accion btn-eliminar" onclick="confirmarEliminar()" style="display:none;">🗑️ Eliminar</button>
        </div>
      </div>
    </main>

  </div><!-- /main-layout -->

</div><!-- /app-area -->

<!-- ══════════ MODALES ══════════ -->

<!-- Modal: Favoritos -->
<div class="modal-backdrop" id="modal-favoritos">
  <div class="modal">
    <div class="modal-header">
      <span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        Favoritos
      </span>
      <button class="close-btn" onclick="cerrarModal('modal-favoritos')">✕</button>
    </div>
    <div class="modal-body fav-body">
      <input type="text" id="fav-search" placeholder="Buscar favorito…" oninput="filtrarFavoritos()" autocomplete="off" class="fav-search-input">
      <div id="fav-lista"></div>
    </div>
  </div>
</div>

<!-- Modal: Crear muestra -->
<div class="modal-backdrop" id="modal-crear">
  <div class="modal">
    <div class="modal-header">
      <span>Nueva muestra</span>
      <button class="close-btn" onclick="cerrarModal('modal-crear')">✕</button>
    </div>
    <div class="modal-body">
      <label>Nombre *</label>
      <input type="text" id="crear-nombre" placeholder="Nombre de la muestra">
      <label>Descripción</label>
      <textarea id="crear-desc" placeholder="Descripción de la muestra…"></textarea>
      <label>Categoría</label>
      <div class="autocomplete-wrap">
        <input type="text" id="crear-cat-texto" placeholder="Escribe para buscar…" oninput="sugerirCat('crear')" autocomplete="off">
        <div class="autocomplete-list" id="crear-cat-lista"></div>
      </div>
      <label>Imágenes</label>
      <div id="imagenes-container"></div>
      <button type="button" class="btn-cancel" onclick="agregarCampoImagen()" style="align-self:flex-start; margin-top:4px;">+ Agregar imagen</button>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="cerrarModal('modal-crear')">Cancelar</button>
      <button class="btn-confirm" onclick="subirMuestra()">Subir muestra</button>
    </div>
  </div>
</div>

<!-- Modal: Editar muestra -->
<div class="modal-backdrop" id="modal-editar">
  <div class="modal">
    <div class="modal-header">
      <span>Editar muestra</span>
      <button class="close-btn" onclick="cerrarModal('modal-editar')">✕</button>
    </div>
    <div class="modal-body">
      <label>Nombre *</label>
      <input type="text" id="editar-nombre" placeholder="Nombre">
      <label>Descripción</label>
      <textarea id="editar-desc" placeholder="Descripción…"></textarea>
      <label>Categoría</label>
      <div class="autocomplete-wrap">
        <input type="text" id="editar-cat-texto" placeholder="Escribe para buscar…" oninput="sugerirCat('editar')" autocomplete="off">
        <div class="autocomplete-list" id="editar-cat-lista"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="cerrarModal('modal-editar')">Cancelar</button>
      <button class="btn-confirm" onclick="editarMuestra()">Guardar cambios</button>
    </div>
  </div>
</div>

<!-- Modal: Confirmar eliminación -->
<div class="modal-backdrop" id="modal-eliminar">
  <div class="modal modal-sm">
    <div class="modal-header">
      <span>Eliminar muestra</span>
      <button class="close-btn" onclick="cerrarModal('modal-eliminar')">✕</button>
    </div>
    <div class="modal-body">
      <p class="confirm-text">¿Seguro que deseas eliminar <strong id="eliminar-nombre-label"></strong>? Esta acción no se puede deshacer.</p>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="cerrarModal('modal-eliminar')">Cancelar</button>
      <button class="btn-danger" onclick="eliminarMuestra()">Sí, eliminar</button>
    </div>
  </div>
</div>

<script src="state.js"></script>
<script src="favoritos.js"></script>
<script src="catalogo.js"></script>
<script src="muestras.js"></script>
<script src="../CHECK-IN/auth.js"></script>
</body>
</html>
