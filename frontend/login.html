<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="pantalla-auth">
  <div class="card-auth">

    <div class="auth-logo">🔬</div>
    <h1>MUESTRAS</h1>
    <p class="auth-subtitulo">Inicia sesión para continuar</p>

    <!-- MENSAJE DE ERROR -->
    <div class="auth-error" id="auth-error" style="display:none">
      <span id="auth-error-msg"></span>
    </div>

    <!-- FORMULARIO -->
    <div class="auth-form">
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email">
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-principal" onclick="loginEmail()">Iniciar sesión</button>
    </div>

    <div class="separador"><span>o</span></div>

    <!-- GOOGLE -->
   <div id="btn-google-container"></div>

    <p class="auth-link">¿No tienes cuenta? <a href="register.html">Crear cuenta</a></p>

  </div>
</div>
<script src="https://accounts.google.com/gsi/client"></script>
<script src="auth.js"></script>
</body>
</html>
