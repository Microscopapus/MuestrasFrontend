<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muestras</title>
  <link rel="stylesheet" href="panpri.css">
</head>
<body>

<!-- ══ TOPBAR ══ -->
<header class="topbar">
  <h1>MUESTRAS</h1>
  <div class="topbar-actions">
    <button class="icon-btn" id="btn-fav-topbar" title="Mis favoritos" onclick="abrirFavoritos()">★</button>
    <button class="icon-btn" title="Nueva muestra" onclick="abrirModalCrear()">＋</button>
    <button class="icon-btn" title="Catálogo" onclick="abrirMenu()">☰</button>
    <button class="logout-btn" title="Cerrar Sesión" onclick="cerrarSesion()">Salir ➔</button>
  </div>
</header>

<!-- Overlay general -->
<div class="overlay" id="overlay" onclick="cerrarTodo()"></div>

<!-- ══ MENÚ LATERAL: Catálogo ══ -->
<nav id="menu">
  <div class="menu-header">
    <span>🔬 Catálogo</span>
    <button class="close-btn" onclick="cerrarMenu()">✕</button>
  </div>
  <div class="menu-grid" id="menu-grid"></div>
</nav>

<!-- ══ PANEL FAVORITOS ══ -->
<aside id="panel-favoritos">
  <div class="menu-header">
    <span>★ Favoritos</span>
    <button class="close-btn" onclick="cerrarFavoritos()">✕</button>
  </div>
  <div class="fav-search-wrap">
    <input type="text" id="fav-search" placeholder="Buscar favorito…" oninput="filtrarFavoritos()" autocomplete="off" />
  </div>
  <div id="fav-lista"></div>
</aside>

<!-- ══ PANTALLAS ══ -->
<div class="pantalla" id="pantalla-cargando">
  <div class="spinner-grande"></div>
  <p>Cargando catálogo…</p>
</div>

<div class="pantalla" id="pantalla-error">
  <div class="error-icono-grande">⚠️</div>
  <h2>No se pudo cargar el catálogo</h2>
  <div id="error-msg"></div>
  <button class="btn-reintentar" onclick="cargarMuestras()">↺ Reintentar</button>
</div>

<div class="pantalla" id="pantalla-contenido">
  <!-- Estado vacío -->
  <div class="detalle-vacio" id="detalle-vacio">
    <div class="vacio-icono">🔬</div>
    <p>Abre el menú y selecciona<br>una muestra para verla aquí</p>
  </div>

  <!-- Detalle de muestra -->
  <div id="detalle-muestra">
    <div id="detalle-imagen"></div>
    <h2 id="detalle-nombre"></h2>
    <span class="badge" id="detalle-cat"></span>
    <p id="detalle-desc"></p>
    <!-- FIX: id agregado para que el JS pueda mostrar/ocultar según ownership -->
    <div class="detalle-acciones" id="detalle-acciones-crud">
      <button class="btn-accion btn-editar" onclick="abrirModalEditar()">✏️ Editar</button>
      <button class="btn-accion btn-eliminar" onclick="confirmarEliminar()">🗑️ Eliminar</button>
    </div>
  </div>
</div>

<!-- ══════════════ MODALES ══════════════ -->

<!-- Modal: Crear muestra -->
<div class="modal-backdrop" id="modal-crear">
  <div class="modal">
    <div class="modal-header">
      <span>➕ Nueva muestra</span>
      <button class="close-btn" onclick="cerrarModal('modal-crear')">✕</button>
    </div>
    <div class="modal-body">
      <label>Nombre *</label>
      <input type="text" id="crear-nombre" placeholder="Nombre de la muestra" />

      <label>Descripción</label>
      <textarea id="crear-desc" placeholder="Descripción de la muestra…"></textarea>

      <!-- Categorías: pendiente hasta tener el endpoint disponible -->
      <!--
      <label>Categorías</label>
      <input type="text" id="crear-cat" placeholder="Categorías" />
      -->

      <!-- FIX: campo Objetivo requerido por el endpoint subir_imagen -->
      <label>Objetivo *</label>
      <input type="number" id="crear-objetivo" placeholder="Objetivo (número)" min="0" />

      <label>Imagen</label>
      <input type="file" id="crear-img" accept="image/*" />
      <div id="crear-preview" class="img-preview"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="cerrarModal('modal-crear')">Cancelar</button>
      <button class="btn-confirm" onclick="subirMuestra()">Subir muestra</button>
    </div>
  </div>
</div>

<!-- Modal: Editar muestra -->
<div class="modal-backdrop" id="modal-editar">
  <div class="modal">
    <div class="modal-header">
      <span>✏️ Editar muestra</span>
      <button class="close-btn" onclick="cerrarModal('modal-editar')">✕</button>
    </div>
    <div class="modal-body">
      <label>Nombre *</label>
      <input type="text" id="editar-nombre" placeholder="Nombre" />

      <label>Descripción</label>
      <textarea id="editar-desc" placeholder="Descripción…"></textarea>

      <!-- Categorías: pendiente hasta tener el endpoint disponible -->
      <!--
      <label>Categorías</label>
      <input type="text" id="editar-cat" placeholder="Categorías" />
      -->
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="cerrarModal('modal-editar')">Cancelar</button>
      <button class="btn-confirm" onclick="editarMuestra()">Guardar cambios</button>
    </div>
  </div>
</div>

<!-- Modal: Confirmar eliminación -->
<div class="modal-backdrop" id="modal-eliminar">
  <div class="modal modal-sm">
    <div class="modal-header">
      <span>🗑️ Eliminar muestra</span>
      <button class="close-btn" onclick="cerrarModal('modal-eliminar')">✕</button>
    </div>
    <div class="modal-body">
      <p class="confirm-text">¿Seguro que deseas eliminar <strong id="eliminar-nombre-label"></strong>? Esta acción no se puede deshacer.</p>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="cerrarModal('modal-eliminar')">Cancelar</button>
      <button class="btn-danger" onclick="eliminarMuestra()">Sí, eliminar</button>
    </div>
  </div>
</div>

<script src="panpri.js"></script>
<script src="auth.js"></script>
</body>
</html>
